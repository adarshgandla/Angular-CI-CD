services:
  app:
    image: ghcr.io/adarshgandla/angular-ci-cd:latest
    build:
      context: .
      target: runtime
    container_name: angular-ci-cd
    ports:
      - "8080:80"
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_POLL_INTERVAL=30 # Checks for newer images on GHCR every 30 seconds
      - WATCHTOWER_CLEANUP=true     # Automatically deletes old image layers after updating
      - WATCHTOWER_INCLUDE_RESTARTING=true
