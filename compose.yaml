services:
  app:
    image: ghcr.io/adarshgandla/angular-ci-cd:latest
    build:
      context: .
      target: runtime
    container_name: angular-app
    ports:
      - "8080:80"
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_POLL_INTERVAL=60 # Checks for newer images on GHCR every 60 seconds
      - WATCHTOWER_CLEANUP=true     # Removes outdated images after updating
      - WATCHTOWER_LABEL_ENABLE=true # Only update containers explicitly labeled for watchtower
      - WATCHTOWER_INCLUDE_RESTARTING=true
